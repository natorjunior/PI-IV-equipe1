<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Criar Sala - Mentor.io</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/home.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <a href="/home" class="logo">Mentor.io</a>
        
        <nav>
            <a href="/home"><i class="fas fa-home"></i> Home</a> 
            <a href="/salas"><i class="fas fa-users"></i> Salas</a>
            
            <div style="display: inline-block; margin-left: 20px;">
                <span class="nome-usuario-display" style="font-weight: bold; margin-right: 10px;"></span>
                
                <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-size: 18px;" title="Mudar Tema">
                    🌓
                </button>
                
                <button onclick="localStorage.clear(); window.location.href='/';" style="background:none; border:none; cursor:pointer; font-size: 18px; color: red;" title="Sair">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </nav>
    </header>

    <script>
        // 1. Carregar Nome
        document.addEventListener("DOMContentLoaded", () => {
            const nome = localStorage.getItem("nome_usuario") || "Usuário";
            const displays = document.querySelectorAll(".nome-usuario-display");
            displays.forEach(el => el.textContent = nome);

            // 2. Aplicar Tema salvo ao carregar a página
            const temaSalvo = localStorage.getItem("theme");
            if (temaSalvo === "dark") {
                document.body.classList.add("dark-mode");
            }
        });

        // 3. Função para alternar tema (disponível globalmente)
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            localStorage.setItem("theme", isDark ? "dark" : "light");
        }
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const nome = localStorage.getItem("nome_usuario") || "Usuário";
            const displays = document.querySelectorAll(".nome-usuario-display");
            displays.forEach(el => el.textContent = nome);
        });
    </script>

    <main class="container">
        <section class="criar-secao-conteudo">
            <h2>Criar Nova Sala de Estudo</h2>
            <form id="form-criar-sala" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                
                <div class="form-group">
                    <label>Nome da Sala:</label>
                    <input type="text" id="room-name" placeholder="Ex: Grupo de Cálculo I" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                </div>

                <div class="form-group">
                    <label>Objetivo / Conteúdo:</label>
                    <textarea id="room-objective" placeholder="Ex: Vamos resolver a lista de integrais..." required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; min-height: 80px;"></textarea>
                </div>

                <div class="form-group">
                    <label>Tipo de Sala:</label>
                    <select id="room-type" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                        <option value="public">Pública (Aberta a todos)</option>
                        <option value="private">Privada (Requer Senha)</option>
                    </select>
                </div>

                <div class="form-group" id="password-group" style="display: none;">
                    <label>Defina uma Senha:</label>
                    <input type="password" id="room-password" placeholder="Senha da sala" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
                </div>

                <button type="submit" class="btn-post" style="width: 100%; margin-top: 10px;">Criar Sala</button>
            </form>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script/salas.js') }}"></script>
</body>
</html>
